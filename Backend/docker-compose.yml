services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: Postgres
      ConnectionStrings__Postgres: Host=postgres;Database=harekat;Username=harekat;Password=harekat
      Jwt__Secret: HarekatProdSecretKey_ChangeMe_UseVault_Min32!
      Swagger__Enabled: "true"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harekat
      POSTGRES_USER: harekat
      POSTGRES_PASSWORD: harekat
    ports:
      - "5432:5432"
    volumes:
      - harekat_pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - harekat_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  harekat_pg:
  harekat_redis:
