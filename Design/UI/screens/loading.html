<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Yükleme — HAREKÂT</title>
  <link rel="stylesheet" href="../css/screens.css"/>
</head>
<body>
  <div class="frame" data-screen="loading" aria-label="Yükleme ekranı">
    <div class="flag-stripe" aria-hidden="true"></div>
    <div class="screen-load">
      <p class="brand" style="font-size:var(--font-title)">HARE<span class="mark">KÂT</span></p>
      <h1 class="screen-load__map">Kuzgun Vadisi</h1>
      <p class="label-muted">İntikal: T-70 · Standart zorluk · 8 tim</p>
      <div class="screen-load__bar" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100">
        <span></span>
      </div>
      <p class="screen-load__pct">%68</p>
      <p class="screen-load__tip">İpucu: Komutan ölürse komuta zinciri en kıdemli hayattaki üyeye geçer. Emir tekerleği sayılarla da kullanılır.</p>
    </div>
  </div>
  <script src="../css/scale.js"></script>
</body>
</html>
