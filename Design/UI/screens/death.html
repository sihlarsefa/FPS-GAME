<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Ölüm — HAREKÂT</title>
  <link rel="stylesheet" href="../css/screens.css"/>
</head>
<body>
  <div class="frame" data-screen="death" aria-label="Ölüm ekranı">
    <div class="screen-end screen-end--death">
      <p class="tag tag--enemy">Devre dışı</p>
      <h1>Düştün</h1>
      <p class="label-muted">Kr. Bozkurt · MPT-76 · 86 m</p>
      <div class="screen-end__stats">
        <div><strong>7</strong>Öldürme</div>
        <div><strong>2</strong>Asist</div>
        <div><strong>4.</strong>Tim sırası</div>
      </div>
      <p class="label-muted">Komuta → Astsb. Çelik · İzleyici modu</p>
      <div class="screen-end__actions">
        <button class="btn btn--primary" type="button">Tim arkadaşı izle</button>
        <button class="btn" type="button">Sonraki</button>
        <button class="btn btn--ghost" type="button">Menü</button>
      </div>
    </div>
  </div>
  <script src="../css/scale.js"></script>
</body>
</html>
