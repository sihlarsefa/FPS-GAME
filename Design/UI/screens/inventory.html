<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Envanter — HAREKÂT</title>
  <link rel="stylesheet" href="../css/screens.css"/>
</head>
<body>
  <div class="frame" data-screen="inventory" aria-label="Envanter">
    <div class="screen-inv">
      <div class="panel inv-grid" role="list">
        <div class="inv-slot is-filled is-selected" role="listitem">
          <img class="icon" src="../icons/weapons/rifle.svg" alt=""/><span>MPT-76</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/weapons/pistol.svg" alt=""/><span>Tabanca</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/weapons/grenade.svg" alt=""/><span>×2</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/items/ammo.svg" alt=""/><span>7.62</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/items/medkit.svg" alt=""/><span>×3</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/items/armor.svg" alt=""/><span>Lv2</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/items/boost.svg" alt=""/><span>×1</span>
        </div>
        <div class="inv-slot is-filled" role="listitem">
          <img class="icon" src="../icons/items/radio.svg" alt=""/><span>Telsiz</span>
        </div>
        <div class="inv-slot" role="listitem"></div>
        <div class="inv-slot" role="listitem"></div>
        <div class="inv-slot" role="listitem"></div>
        <div class="inv-slot" role="listitem"></div>
      </div>
      <aside class="panel inv-detail panel--strip">
        <h3>MPT-76</h3>
        <p class="tag">Tüfek · 7.62</p>
        <p class="label-muted" style="margin:16px 0">Şarjör 30 · RPM 650 · Orta menzil. Tim taarruzunda birincil.</p>
        <ul class="career-list">
          <li><span>Hasar</span><strong>42</strong></li>
          <li><span>Menzil düşüşü</span><strong>180 m</strong></li>
          <li><span>Mermi</span><strong>28 / 120</strong></li>
        </ul>
        <div class="row" style="margin-top:24px;gap:8px">
          <button class="btn btn--sm btn--primary" type="button">Kuşan</button>
          <button class="btn btn--sm btn--ghost" type="button">Bırak</button>
        </div>
      </aside>
    </div>
  </div>
  <script src="../css/scale.js"></script>
</body>
</html>
