<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Zafer — HAREKÂT</title>
  <link rel="stylesheet" href="../css/screens.css"/>
</head>
<body>
  <div class="frame" data-screen="victory" aria-label="Zafer ekranı">
    <div class="screen-end screen-end--victory">
      <p class="tag tag--amber">Harekât tamam</p>
      <h1>Kazanan Tim</h1>
      <p class="label-muted">Mavi kuvvet · Kuzgun Vadisi</p>
      <div class="screen-end__stats">
        <div><strong>1.</strong>Yerleşim</div>
        <div><strong>24</strong>Tim öldürme</div>
        <div><strong>+1 450</strong>XP</div>
      </div>
      <div class="row" style="gap:24px;margin-top:8px">
        <img class="icon--lg" src="../icons/ranks/yuzbasi.svg" alt=""/>
        <img class="icon--lg" src="../icons/ranks/astsubay.svg" alt=""/>
        <img class="icon--lg" src="../icons/ranks/cavus.svg" alt=""/>
        <img class="icon--lg" src="../icons/ranks/er.svg" alt=""/>
      </div>
      <div class="screen-end__actions">
        <button class="btn btn--primary" type="button">Yeniden</button>
        <button class="btn" type="button">Kariyer</button>
        <button class="btn btn--ghost" type="button">Ana menü</button>
      </div>
    </div>
  </div>
  <script src="../css/scale.js"></script>
</body>
</html>
