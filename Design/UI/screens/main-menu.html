<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Ana Menü — HAREKÂT</title>
  <link rel="stylesheet" href="../css/screens.css"/>
</head>
<body>
  <div class="frame" data-screen="main-menu" aria-label="Ana menü">
    <div class="flag-stripe" aria-hidden="true"></div>
    <div class="screen-menu">
      <div class="screen-menu__hero">
        <p class="label-muted">FPP Tim Battle Royale · Tatbikat</p>

      </div>
      <nav class="screen-menu__nav panel panel--strip" aria-label="Ana menü">
        <button class="btn btn--primary" type="button">Hızlı Maç</button>
        <button class="btn" type="button">Harekât Kurulumu</button>
        <button class="btn" type="button">Atış Poligonu</button>
        <button class="btn" type="button">Tim</button>
        <button class="btn" type="button">Kariyer</button>
        <button class="btn" type="button">Ayarlar</button>
        <button class="btn btn--ghost" type="button">Çıkış</button>
      </nav>
    </div>
    <p class="screen-menu__meta">v0.2 mockup · 1920×1080</p>
  </div>
  <script src="../css/scale.js"></script>

</html>
