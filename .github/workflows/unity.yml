name: Unity CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity.yml"
  workflow_dispatch:

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "6000.6.0f1"

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library (tests)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-EditMode-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-${{ env.UNITY_VERSION }}-
            Library-${{ env.UNITY_VERSION }}-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          checkName: EditMode Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -nographics -batchmode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14
          if-no-files-found: ignore

  build-macos:
    name: Build macOS (BatchEntry.BuildMac)
    runs-on: macos-latest
    needs: editmode-tests
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library (macOS)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneOSX-${{ env.UNITY_VERSION }}-
            Library-${{ env.UNITY_VERSION }}-

      - name: Build macOS player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneOSX
          buildMethod: BatchEntry.BuildMac
          buildsPath: Builds
          buildName: Harekat

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: unity-macos
          path: Builds/StandaloneOSX/
          retention-days: 14
          if-no-files-found: error

  build-linux-server:
    name: Build Linux Dedicated Server
    runs-on: ubuntu-latest
    needs: editmode-tests
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library (Linux Server)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneLinux64-Server-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-Server-${{ env.UNITY_VERSION }}-
            Library-${{ env.UNITY_VERSION }}-

      - name: Build Linux dedicated server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: BatchEntry.BuildLinuxDedicatedServer
          buildsPath: Builds
          buildName: HarekatServer

      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v7
        with:
          name: unity-linux-dedicated-server
          path: Builds/StandaloneLinux64/
          retention-days: 14
          if-no-files-found: error
