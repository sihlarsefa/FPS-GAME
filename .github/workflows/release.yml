name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (örn. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  UNITY_VERSION: "6000.6.0f1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changelog:
    name: Conventional Commits Changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      changelog: ${{ steps.body.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        continue-on-error: true
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_FRAGMENT.md

      - name: Expose changelog body
        id: body
        run: |
          {
            echo "changelog<<EOF"
            if [ -f CHANGELOG_FRAGMENT.md ] && [ -s CHANGELOG_FRAGMENT.md ]; then
              cat CHANGELOG_FRAGMENT.md
            else
              echo "### Changes"
              echo
              echo "Bu sürüm için conventional commit geçmişi üretilemedi."
              echo "Commit mesajları \`feat:\`, \`fix:\`, \`chore:\` formatında olmalıdır."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    name: Backend Release Artifacts
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: >
          dotnet publish Backend/Harekat.Api/Harekat.Api.csproj
          --configuration Release
          --output ./artifacts/backend
          -p:Version=${{ needs.changelog.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.changelog.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Pack backend artifact
        run: |
          cd artifacts
          tar -czf backend-${{ needs.changelog.outputs.tag }}.tar.gz backend/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend
          path: artifacts/backend-*.tar.gz
          retention-days: 90

  build-web:
    name: Web Release Artifacts
    runs-on: ubuntu-latest
    needs: changelog
    if: hashFiles('Web/package.json') != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install & build
        working-directory: Web
        run: |
          npm ci
          npm run build

      - name: Pack web artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/web-${{ needs.changelog.outputs.tag }}.tar.gz -C Web dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts/web-*.tar.gz
          retention-days: 90

  build-unity:
    name: Unity Release Builds
    runs-on: ${{ matrix.os }}
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: StandaloneOSX
            buildMethod: BatchEntry.BuildMac
            artifact: unity-macos
          - os: ubuntu-latest
            platform: StandaloneLinux64
            buildMethod: BatchEntry.BuildLinuxDedicatedServer
            artifact: unity-linux-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.platform }}-${{ env.UNITY_VERSION }}-
            Library-${{ env.UNITY_VERSION }}-

      - name: Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.buildMethod }}
          buildsPath: Builds
          buildName: Harekat

      - name: Pack Unity artifact
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.artifact }}-${{ needs.changelog.outputs.tag }}.tar.gz" -C Builds ${{ matrix.platform }}

      - name: Upload Unity artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: artifacts/*.tar.gz
          retention-days: 90

  publish-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build-backend, build-web, build-unity]
    if: always() && needs.changelog.result == 'success' && needs.build-backend.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ needs.changelog.outputs.tag }}
          CHANGELOG: ${{ needs.changelog.outputs.changelog }}
        run: |
          {
            echo "## HAREKÂT ${TAG}"
            echo
            echo "${CHANGELOG}"
            echo
            echo "### Artefaktlar"
            echo "- Backend API (tar.gz + GHCR imajı)"
            echo "- Web portal (varsa)"
            echo "- Unity macOS istemci (\`BatchEntry.BuildMac\`)"
            echo "- Unity Linux dedicated server"
            echo
            echo "Docker: \`ghcr.io/${{ github.repository }}:${TAG}\`"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          name: HAREKÂT ${{ needs.changelog.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.changelog.outputs.tag, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
