name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      changelog: ${{ steps.body.outputs.changelog }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image name (lowercase)
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        continue-on-error: true
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_FRAGMENT.md

      - name: Expose changelog body
        id: body
        run: |
          {
            echo "changelog<<EOF"
            if [ -f CHANGELOG_FRAGMENT.md ] && [ -s CHANGELOG_FRAGMENT.md ]; then
              cat CHANGELOG_FRAGMENT.md
            else
              echo "### Changes"
              echo
              echo "Conventional changelog could not be generated."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    name: Backend Release Artifacts
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: >
          dotnet publish Backend/Harekat.Api/Harekat.Api.csproj
          --configuration Release
          --output ./artifacts/backend
          -p:Version=${{ needs.changelog.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changelog.outputs.image }}:${{ needs.changelog.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.changelog.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Pack backend artifact
        run: |
          cd artifacts
          tar -czf backend-${{ needs.changelog.outputs.tag }}.tar.gz backend/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend
          path: artifacts/backend-*.tar.gz
          retention-days: 90

  build-web:
    name: Web Release Artifacts
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install and build
        working-directory: Web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Pack web artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/web-${{ needs.changelog.outputs.tag }}.tar.gz -C Web dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts/web-*.tar.gz
          retention-days: 90

  publish-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build-backend, build-web]
    if: always() && needs.changelog.result == 'success' && needs.build-backend.result == 'success'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ needs.changelog.outputs.tag }}
          CHANGELOG: ${{ needs.changelog.outputs.changelog }}
          IMAGE: ${{ needs.changelog.outputs.image }}
        run: |
          {
            echo "## HAREKAT ${TAG}"
            echo
            echo "${CHANGELOG}"
            echo
            echo "### Artifacts"
            echo "- Backend API (tar.gz + GHCR image)"
            echo "- Web portal"
            echo
            echo "Docker: \`ghcr.io/${IMAGE}:${TAG}\`"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          name: HAREKAT ${{ needs.changelog.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.changelog.outputs.tag, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
