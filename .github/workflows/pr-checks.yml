name: PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  backend-format-analyzers:
    name: Backend Format & Analyzers
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      contains(toJSON(github.event.pull_request.labels.*.name), 'skip-backend') == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Backend exists
        id: check
        run: |
          if [ -f Backend/Harekat.Backend.sln ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: steps.check.outputs.exists == 'true'
        run: dotnet restore Backend/Harekat.Backend.sln

      - name: Format check
        if: steps.check.outputs.exists == 'true'
        run: >
          dotnet format Backend/Harekat.Backend.sln
          --verify-no-changes
          --severity warn
          --verbosity normal

      - name: Build with analyzers
        if: steps.check.outputs.exists == 'true'
        run: >
          dotnet build Backend/Harekat.Backend.sln
          --configuration Release
          --no-restore
          -p:TreatWarningsAsErrors=false
          -p:EnableNETAnalyzers=true
          -p:AnalysisLevel=latest
          -p:EnforceCodeStyleInBuild=true

      - name: Skip notice
        if: steps.check.outputs.exists != 'true'
        run: echo "Backend çözümü henüz yok; format/analyzer adımı atlandı."

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Web exists
        id: check
        run: |
          if [ -f Web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: npm install
        if: steps.check.outputs.exists == 'true'
        working-directory: Web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: Web
        run: npm run lint

      - name: Skip notice
        if: steps.check.outputs.exists != 'true'
        run: echo "Web/ henüz yok; lint adımı atlandı."

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          queries: security-extended

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
