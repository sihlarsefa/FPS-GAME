name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Hedef ortam"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Dağıtılacak imaj etiketi (örn. sha-abc1234 veya v1.0.0)"
        required: true
        type: string
      confirm_production:
        description: "Production için 'deploy' yazın"
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.workflow_run.head_branch || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  KUBE_NAMESPACE: harekat

jobs:
  gate-production:
    name: Production Confirmation Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    steps:
      - name: Verify production confirmation
        run: |
          if [ "${{ inputs.confirm_production }}" != "deploy" ]; then
            echo "::error::Production dağıtımı için confirm_production alanına 'deploy' yazılmalı."
            exit 1
          fi
          echo "Production onayı alındı."

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: []
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: staging
      url: https://staging.harekat.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Image name (lowercase)
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend (staging)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          kubectl set image deployment/harekat-backend \
            api="${IMAGE}" \
            -n "${KUBE_NAMESPACE}" \
            --record || \
          kubectl apply -k Deploy/k8s/overlays/blue

          kubectl set env deployment/harekat-backend \
            ASPNETCORE_ENVIRONMENT=Staging \
            -n "${KUBE_NAMESPACE}" || true

          kubectl rollout status deployment/harekat-backend \
            -n "${KUBE_NAMESPACE}" \
            --timeout=300s

      - name: Smoke health check
        run: |
          echo "Staging health kontrolü (Ingress üzerinden)..."
          # Ortam URL'si secret ile override edilebilir
          HEALTH_URL="${{ secrets.STAGING_HEALTH_URL }}"
          HEALTH_URL="${HEALTH_URL:-https://staging.harekat.example.com/health}"
          curl -fsS --retry 5 --retry-delay 5 "$HEALTH_URL" || {
            echo "::warning::Health endpoint yanıt vermedi; manuel doğrulama gerekebilir."
          }

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [gate-production]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: https://harekat.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Image name (lowercase)
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Blue-green image update
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          ACTIVE=$(kubectl get svc harekat-backend -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
          if [ "$ACTIVE" = "blue" ]; then
            TARGET=green
          else
            TARGET=blue
          fi
          echo "Aktif=${ACTIVE} → hedef=${TARGET}"

          kubectl set image "deployment/harekat-backend-${TARGET}" \
            api="${IMAGE}" \
            -n "${KUBE_NAMESPACE}" || \
          kubectl apply -k "Deploy/k8s/overlays/${TARGET}"

          kubectl rollout status "deployment/harekat-backend-${TARGET}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=300s

          echo "target=${TARGET}" >> "$GITHUB_ENV"

      - name: Switch traffic (manual approval already via environment)
        run: |
          kubectl patch svc harekat-backend -n "${KUBE_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"version\":\"${TARGET}\"}}}"
          echo "Production trafiği ${TARGET} sürümüne alındı."

      - name: Production health check
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_HEALTH_URL }}"
          HEALTH_URL="${HEALTH_URL:-https://harekat.example.com/health}"
          curl -fsS --retry 8 --retry-delay 5 "$HEALTH_URL"
          echo "Production health OK."
