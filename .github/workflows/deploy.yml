name: Deploy (deprecated — use Windows Deploy)

# Linux/Kubernetes yolu kullanılmıyor. Canlı dağıtım:
#   .github/workflows/windows-deploy.yml  →  Deploy/windows/deploy.ps1
# Bu workflow yalnızca manuel arşiv / ileride k8s denemesi içindir.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Hedef ortam (k8s — kullanılmıyor)"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Dağıtılacak imaj etiketi (örn. sha-abc1234 veya v1.0.0)"
        required: true
        type: string
      confirm_production:
        description: "Production için 'deploy' yazın"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-deprecated-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  KUBE_NAMESPACE: harekat

jobs:
  notice:
    name: Use Windows Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated notice
        run: |
          echo "::warning::Kubernetes Deploy workflow is deprecated. Use 'Windows Deploy' (windows-deploy.yml) for IIS + SQL Server."
          echo "Production path: Deploy/windows/deploy.ps1 on WIN_HOST"
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.confirm_production }}" != "deploy" ]; then
            echo "::error::Production için confirm_production=deploy gerekli (yine de k8s yolu önerilmez)."
            exit 1
          fi
          exit 0

  # Aşağıdaki k8s job'ları bilinçli olarak kapalı — secrets yoksa kırılmasın.
  # İleride tekrar açmak için windows-deploy dışı ayrı bir workflow kullanın.
