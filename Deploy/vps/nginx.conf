server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /auth/ {
        proxy_pass http://api:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /players/ {
        proxy_pass http://api:8080/players/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /squads {
        proxy_pass http://api:8080/squads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /matchmaking/ {
        proxy_pass http://api:8080/matchmaking/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /servers/ {
        proxy_pass http://api:8080/servers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /matches/ {
        proxy_pass http://api:8080/matches/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /leaderboards {
        proxy_pass http://api:8080/leaderboards;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://api:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /telemetry/ {
        proxy_pass http://telemetry:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
