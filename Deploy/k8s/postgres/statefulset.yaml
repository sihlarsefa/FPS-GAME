apiVersion: v1
kind: Service
metadata:
  name: harekat-postgres
  namespace: harekat
  labels:
    app: harekat-postgres
spec:
  clusterIP: None
  selector:
    app: harekat-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harekat-postgres
  namespace: harekat
  labels:
    app: harekat-postgres
spec:
  serviceName: harekat-postgres
  replicas: 1
  selector:
    matchLabels:
      app: harekat-postgres
  template:
    metadata:
      labels:
        app: harekat-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: harekat
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: harekat-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harekat-postgres-secrets
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "archive_mode=on"
            - "-c"
            - "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "wal_keep_size=1GB"
            - "-c"
            - "shared_buffers=256MB"
            - "-c"
            - "max_connections=200"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "harekat", "-d", "harekat"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "harekat", "-d", "harekat"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: wal-archive
              mountPath: /wal-archive
      volumes:
        - name: wal-archive
          persistentVolumeClaim:
            claimName: harekat-postgres-wal
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harekat-postgres-wal
  namespace: harekat
  labels:
    app: harekat-postgres
    purpose: pitr-wal
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
