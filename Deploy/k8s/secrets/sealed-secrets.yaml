# Sealed Secrets — üretim (kubeseal ile şifrele)
# Önkoşul: sealed-secrets controller kurulu olmalı
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harekat-backend-secrets
  namespace: harekat
  labels:
    app: harekat-backend
spec:
  encryptedData:
    Jwt__SigningKey: AgAAAA==PLACEHOLDER_SEAL_JWT
    ServerKey: AgAAAA==PLACEHOLDER_SEAL_SERVER_KEY
    ConnectionStrings__PostgresPassword: AgAAAA==PLACEHOLDER_SEAL_PG_PASS
  template:
    metadata:
      name: harekat-backend-secrets
      namespace: harekat
      labels:
        app: harekat-backend
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harekat-postgres-secrets
  namespace: harekat
  labels:
    app: harekat-postgres
spec:
  encryptedData:
    username: AgAAAA==PLACEHOLDER_SEAL_PG_USER
    password: AgAAAA==PLACEHOLDER_SEAL_PG_PASS
  template:
    metadata:
      name: harekat-postgres-secrets
      namespace: harekat
    type: Opaque
