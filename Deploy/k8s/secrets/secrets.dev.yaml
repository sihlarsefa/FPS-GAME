# Geliştirme Secret'ları — yalnızca kind/minikube (make dev-up)
apiVersion: v1
kind: Secret
metadata:
  name: harekat-backend-secrets
  namespace: harekat
  labels:
    app: harekat-backend
    environment: dev
type: Opaque
stringData:
  Jwt__SigningKey: "DEV_ONLY_CHANGE_ME_jwt_signing_key_32chars!"
  ServerKey: "DEV_ONLY_SERVER_KEY_harekat"
  ConnectionStrings__PostgresPassword: "harekat_dev_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: harekat-postgres-secrets
  namespace: harekat
  labels:
    app: harekat-postgres
    environment: dev
type: Opaque
stringData:
  username: harekat
  password: harekat_dev_password
