# External Secrets Operator — bulut secret store entegrasyonu
# Önkoşul: helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: harekat-gcp-sm
  namespace: harekat
spec:
  provider:
    gcpsm:
      projectID: "harekat-prod"
      auth:
        workloadIdentity:
          clusterLocation: europe-west3
          clusterName: harekat-gke
          serviceAccountRef:
            name: harekat-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harekat-backend-secrets
  namespace: harekat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: harekat-gcp-sm
    kind: SecretStore
  target:
    name: harekat-backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: harekat-backend
  data:
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: harekat-jwt-signing-key
    - secretKey: ServerKey
      remoteRef:
        key: harekat-server-key
    - secretKey: ConnectionStrings__PostgresPassword
      remoteRef:
        key: harekat-postgres-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harekat-postgres-secrets
  namespace: harekat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: harekat-gcp-sm
    kind: SecretStore
  target:
    name: harekat-postgres-secrets
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: harekat-postgres-username
    - secretKey: password
      remoteRef:
        key: harekat-postgres-password
---
# Alternatif: AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: harekat-aws-sm
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets-system
