apiVersion: apps/v1
kind: Deployment
metadata:
  name: harekat-backend
  namespace: harekat
  labels:
    app: harekat-backend
    app.kubernetes.io/name: harekat-backend
    app.kubernetes.io/part-of: harekat
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: harekat-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: harekat-backend
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: harekat-backend
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: harekat-backend
      containers:
        - name: api
          image: ghcr.io/harekat/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: harekat-backend-config
            - secretRef:
                name: harekat-backend-secrets
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harekat-backend
  namespace: harekat
  labels:
    app: harekat-backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harekat-backend-config
  namespace: harekat
  labels:
    app: harekat-backend
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  REGION: "eu-istanbul"
  REDIS_CONNECTION: "harekat-redis:6379"
  ConnectionStrings__Postgres: "Host=harekat-postgres;Port=5432;Database=harekat;Username=harekat"
  MATCHMAKING__MaxSquadSize: "10"
  MATCHMAKING__MinPlayersPerMatch: "40"
  MATCHMAKING__MaxPlayersPerMatch: "60"
  MATCHMAKING__PreferredRegions: "eu-istanbul,eu-frankfurt,eu-amsterdam"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.harekat-monitoring:4317"
